[project]
name = "imgread-loader-study"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.4.1",
    "pillow==12.3.0",
    "pytest==9.0.2",
    "torch==2.10.0+cpu",
    "torchvision==0.25.0+cpu",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
