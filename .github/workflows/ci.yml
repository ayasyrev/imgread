name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y cmake nasm
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --features turbojpeg

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        turbojpeg: [true, false]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y cmake nasm
      - run: uv sync --locked --no-install-project --python '${{ matrix.python }}'
      - if: matrix.turbojpeg
        run: uv run --no-sync maturin build --release --locked --out dist
      - if: '!matrix.turbojpeg'
        run: uv run --no-sync maturin build --release --locked --no-default-features --features extension-module --out dist
      - run: uv pip install --python .venv/bin/python --no-deps dist/*.whl
      - run: uv run --no-sync pytest python_tests -q
      - if: matrix.python == '3.11' && matrix.turbojpeg
        run: |
          uv pip install --python .venv/bin/python numpy==1.26.4
          uv run --no-sync pytest python_tests -q

  python-prerelease:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15-dev'
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y cmake nasm
      - run: uv venv --python 3.15 .venv
      - run: uv pip install --python .venv/bin/python 'maturin>=1.11,<1.12' numpy pillow pytest pip
      - run: uv run --no-project --no-sync --python .venv/bin/python maturin build --release --locked --out dist
      # Only the prerelease probe bypasses the supported Python version range.
      # --ignore-requires-python is a pip option, not a uv pip option.
      - run: uv run --no-project --no-sync --python .venv/bin/python python -m pip install --no-deps --ignore-requires-python dist/*.whl
      - run: uv run --no-project --no-sync --python .venv/bin/python pytest python_tests -q

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --locked --no-install-project
      - run: cargo install --locked --version 0.22.2 cargo-audit
      - run: cargo install --locked --version 0.20.2 cargo-deny
      - run: cargo audit
      - run: cargo deny check licenses sources
      - name: Audit Python dependencies
        run: |
          uv export --locked --all-groups --no-emit-project --format pylock.toml --output-file "$RUNNER_TEMP/pylock.toml"
          uv run --no-sync pip-audit --locked "$RUNNER_TEMP"
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - run: CARGO_NET_OFFLINE=true uv run --no-sync maturin sdist --out dist
      - run: uv run --no-sync twine check dist/*

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: sudo apt-get update && sudo apt-get install -y cmake nasm
      - run: cargo check --locked --all-features
