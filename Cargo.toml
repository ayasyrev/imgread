[package]
name = "imgread"
version = "0.2.1-dev.0"
edition = "2021"
rust-version = "1.88"
publish = false
include = [
    "/src/**", "/Cargo.toml", "/Cargo.lock", "/pyproject.toml", "/uv.lock", "/python/**",
    "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/licenses/**",
    "/tests/**", "/python_tests/**", "/about.toml", "/about.hbs", "/deny.toml",
]
license = "MIT"
readme = "README.md"
description = "Bounded JPEG, PNG and TIFF decoding into NumPy arrays"
repository = "https://github.com/ayasyrev/imgread"
homepage = "https://github.com/ayasyrev/imgread"

[features]
default = []
loader-diagnostics = []
extension-module = ["pyo3/extension-module"]
turbojpeg = ["dep:turbojpeg"]

[lib]
name = "imgread"
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "0.25.10", default-features = true }
pyo3 = "0.29.2"
numpy = "0.29.0"
turbojpeg = { version = "1.5.1", optional = true }
thiserror = "2.0.20"

[dev-dependencies]
pyo3 = { version = "0.29.2", features = ["auto-initialize"] }

[profile.release]
strip = "symbols"
debug = false
